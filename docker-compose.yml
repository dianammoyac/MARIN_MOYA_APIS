version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: marin_moya_db
    restart: always
    environment:
      MYSQL_DATABASE: bd_marinmoya_inversiones
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  web:
    build: .
    container_name: marin_moya_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=bd_marinmoya_inversiones
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db

volumes:
  mysql_data: