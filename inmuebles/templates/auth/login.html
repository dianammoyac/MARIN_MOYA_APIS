<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 360px;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .login-box h2 {
            margin: 0 0 20px 0;
            text-align: center;
            color: #1f2937;
        }

        .login-box p {
            margin-bottom: 14px;
        }

        .login-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #374151;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #1f2937;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .login-box button:hover {
            opacity: 0.95;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #eef2ff;
            color: #1e3a8a;
            font-size: 14px;
        }

        .errorlist {
            color: #b91c1c;
            margin: 6px 0 0 0;
            padding-left: 18px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Ingreso al sistema</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Ingresar</button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 14px;">
            ¿No tienes cuenta? <a href="{% url 'register' %}" style="color: #1f2937; font-weight: bold; text-decoration: none;">Regístrate aquí</a>
        </p>
    </div>
</body>
</html>
