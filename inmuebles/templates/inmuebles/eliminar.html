{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Confirmar Eliminación</h2>
    <p>¿Estás seguro de que deseas eliminar el inmueble <strong>{{ inmueble.titulo }}</strong>? Esta acción no se puede deshacer.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background: #e74c3c;">Sí, eliminar definitivamente</button>
        <a href="{% url 'inmuebles_listado' %}" class="btn" style="background: #95a5a6; margin-left: 10px;">Cancelar</a>
    </form>
</div>
{% endblock %}
