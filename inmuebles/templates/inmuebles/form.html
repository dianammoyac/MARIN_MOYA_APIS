{% extends 'base.html' %}

{% block content %}
  <div class="container">
    <h1>{% if editando %}Editar{% else %}Crear{% endif %} Inmueble</h1>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar</button>
    </form>

    <p><a href="{% url 'mis_inmuebles' %}">Volver a mis inmuebles</a></p>
  </div>
{% endblock %}
